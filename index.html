    <script>

        let tempo;
        const limite = 30000;

        function esconderVideo() {

            const v    = document.getElementById("video");
            const hint = document.getElementById("video-hint");

            v.style.opacity       = "0";
            v.style.pointerEvents = "none";
            hint.style.opacity    = "0";

            sessionStorage.setItem("videoEscondido", "true");
            sessionStorage.setItem("ultimaInteracao", Date.now());

            resetarTempo();
        }

        function mostrarVideo() {

            const v    = document.getElementById("video");
            const hint = document.getElementById("video-hint");

            v.style.opacity       = "1";
            v.style.pointerEvents = "auto";
            hint.style.opacity    = "1";

            sessionStorage.setItem("videoEscondido", "false");
        }

        function resetarTempo() {

            clearTimeout(tempo);

            sessionStorage.setItem("ultimaInteracao", Date.now());

            tempo = setTimeout(mostrarVideo, limite);
        }


        document.addEventListener("click",      esconderVideo);
        document.addEventListener("touchstart", esconderVideo);
        document.addEventListener("mousemove",  resetarTempo);


        window.onload = function () {

            let escondido = sessionStorage.getItem("videoEscondido");
            let ultima    = sessionStorage.getItem("ultimaInteracao");

            if (escondido === "true") {

                let agora       = Date.now();
                let tempoPassado = agora - ultima;

                if (tempoPassado < limite) {

                    const v    = document.getElementById("video");
                    const hint = document.getElementById("video-hint");

                    v.style.opacity       = "0";
                    v.style.pointerEvents = "none";
                    hint.style.opacity    = "0";

                    tempo = setTimeout(mostrarVideo, limite - tempoPassado);

                }

            }

        }

    </script>
